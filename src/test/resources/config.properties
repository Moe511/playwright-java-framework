# Base URLs (can also be overridden via -Dui.baseUrl=... / -Dapi.baseUrl=...)
ui.baseUrl=https://www.saucedemo.com
api.baseUrl=https://restful-booker.herokuapp.com

# Browser settings
browser=chromium
headless=true
slowMo=0
viewport.width=1280
viewport.height=720

# Timeouts (ms)
defaultTimeout=15000
navigationTimeout=30000

# Trace / video / screenshots — captured on failure (handled in BaseTest)
trace.onFailure=true
video.onFailure=true
screenshot.onFailure=true

# Default credentials for saucedemo
saucedemo.username=standard_user
saucedemo.password=secret_sauce

# Default credentials for restful-booker
booker.username=admin
booker.password=password123
